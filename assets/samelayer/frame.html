<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rex HUD</title>
<style>
  :root{
    --ink:#0b0712; --ink2:#120b1d; --ink3:#191026;
    --text:#efe9f8; --text2:#b3a5c9; --text3:#75678e;
    --gold:#d9b36a; --gold-hi:#f6e3ae; --line:rgba(255,255,255,.10);
    --accent:#8c5cff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ink);color:var(--text);font:14px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .hud{display:flex;height:100%}
  .rail{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0;border-right:1px solid var(--line);background:linear-gradient(90deg,#0e0818,#0b0712)}
  .brand{width:36px;height:36px;border:1px solid rgba(217,179,106,.45);border-radius:10px;display:grid;place-items:center;color:var(--gold);font-weight:700;margin-bottom:8px}
  .nav{width:56px;padding:8px 0;border-radius:10px;color:var(--text2);font-size:12px;text-align:center;line-height:1.3}
  .nav.on{background:rgba(140,92,255,.16);color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(217,179,106,.28)}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
  .bar b{font-weight:600;letter-spacing:.04em}
  .bar small{color:var(--text3)}
  .body{flex:1;overflow:auto;padding:18px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));align-content:start}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:12px;padding:14px}
  .card h3{margin:0 0 6px;font-size:13px;color:var(--gold);font-weight:600;letter-spacing:.04em}
  .card p{margin:0;color:var(--text2);font-size:13px}
  .card kbd{font:inherit;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .dock{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;background:#0a0611}
  .dock button{padding:6px 10px;border:1px solid var(--line);border-radius:8px;color:var(--text2);font-size:12px}
  .dock button:hover{color:var(--gold-hi);border-color:rgba(217,179,106,.4)}
  .toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);max-width:80%;padding:8px 14px;border-radius:10px;background:rgba(12,7,20,.92);border:1px solid rgba(217,179,106,.35);color:var(--gold-hi);font-size:12px;opacity:0;transition:opacity .2s}
  .toast.on{opacity:1}
  @media (max-width:720px){
    .rail{flex:0 0 56px}
    .nav{width:44px;font-size:11px}
    .body{grid-template-columns:1fr;padding:14px}
  }
</style>
</head>
<body>
<div class="hud">
  <nav class="rail">
    <div class="brand">R</div>
    <button class="nav on" data-nav="world">世界</button>
    <button class="nav" data-nav="cast">人物</button>
    <button class="nav" data-nav="map">地图</button>
    <button class="nav" data-nav="sys">设置</button>
  </nav>
  <div class="main">
    <header class="bar"><b id="title">世界</b><small id="hint">与宿主握手中…</small></header>
    <div class="body" id="body"></div>
    <div class="dock" id="dock"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var VER = 1;
  if (window.__REX_HUD_FRAME__ && window.__REX_HUD_FRAME__.ver >= VER) return;

  var seq = 0, pending = Object.create(null), ready = false;
  var toastEl = document.getElementById('toast');
  var hint = document.getElementById('hint');
  var body = document.getElementById('body');
  var dock = document.getElementById('dock');
  var title = document.getElementById('title');

  function toast(msg, ms) {
    toastEl.textContent = String(msg);
    toastEl.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('on'); }, ms || 2200);
  }

  function call(method, params) {
    return new Promise(function (resolve) {
      var id = 'r' + (++seq);
      pending[id] = resolve;
      try { parent.postMessage({ protocol: 'rex-sl/1', type: 'invoke', id: id, method: method, params: params || {} }, '*'); }
      catch (e) { resolve({ ok: false, reason: 'postMessage-failed' }); }
      setTimeout(function () { if (pending[id]) { delete pending[id]; resolve({ ok: false, reason: 'timeout' }); } }, 8000);
    });
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.protocol !== 'rex-sl/1') return;
    if (d.type === 'host-ready') { ready = true; hint.textContent = '宿主已连接 · ' + (d.theme || 'default'); return; }
    if (d.type === 'result' && pending[d.id]) {
      var done = pending[d.id]; delete pending[d.id];
      done(d);
    }
  });

  var PAGES = {
    world: {
      title: '世界', cards: [
        ['时间 · 地点', '示例：第 7 日 · 午后<br>地点：<kbd>武魂城/教皇殿</kbd>'],
        ['世界状态', '这里应放 <b>[状态]</b> 解析出的字段：天气、威胁、章节。'],
        ['设计提示', '首屏只回答三件事：我在哪、我是谁、下一步做什么。']
      ]
    },
    cast: { title: '人物', cards: [['在场', '示例：两位角色，关系与心理各一行。'], ['档案', '一角色一份档案；简要五项：名字/性别/等级/关系/好感。']] },
    map: { title: '地图', cards: [['局部', '当前区域节点图（AI 实时）。'], ['世界', '固定底图 + 地标；点击出气泡。']] },
    sys: { title: '设置', cards: [['协议', '状态块字段名冻结；改名前先改解析器。'], ['存档', '旧版本地 localStorage；新页 sdk.save。']] }
  };

  function paint(key) {
    var p = PAGES[key] || PAGES.world;
    title.textContent = p.title;
    body.innerHTML = p.cards.map(function (c) {
      return '<section class="card"><h3>' + c[0] + '</h3><p>' + c[1] + '</p></section>';
    }).join('');
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      paint(b.dataset.nav);
    });
  });

  var ACTIONS = [
    ['快照', 'snapshot'],
    ['填入文本', 'setInput', { text: '我环顾四周，先看退路。' }],
    ['发送', 'send'],
    ['打开人设', 'openPersona'],
    ['打开更多', 'openMore'],
    ['删消息（应拒绝）', 'deleteMessage', { index: 0 }]
  ];
  dock.innerHTML = ACTIONS.map(function (a, i) { return '<button data-act="' + i + '">' + a[0] + '</button>'; }).join('');
  Array.prototype.forEach.call(dock.querySelectorAll('[data-act]'), function (b) {
    b.addEventListener('click', function () {
      var a = ACTIONS[Number(b.dataset.act)];
      call(a[1], a[2]).then(function (r) {
        toast(a[0] + ' → ' + (r.ok ? 'OK' : '未实现/失败：' + (r.reason || 'unknown')));
      });
    });
  });

  paint('world');
  parent.postMessage({ protocol: 'rex-sl/1', type: 'frame-ready', id: 'boot' }, '*');
  window.__REX_HUD_FRAME__ = { ver: VER, call: call };
})();
</script>
</body>
</html>
