<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMD 同层起点</title>
<style>
:root{--bg:#10161c;--surface:#1a242e;--text:#e8edf2;--muted:#acbbc8;--accent:#8dd7c4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px}button,textarea{font:inherit}button{padding:10px;margin:4px;border:1px solid var(--accent);border-radius:8px;color:var(--text);background:var(--surface)}button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}textarea{width:100%;min-height:100px;padding:12px;background:var(--surface);color:var(--text);border:1px solid var(--muted)}p{color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.55}
</style></head><body><main>
<button id="back">返回 MMD</button><h1>同层界面</h1><p id="state" role="status">连接宿主中…</p>
<textarea id="draft" aria-label="行动草稿" placeholder="先编辑行动，再确认发送"></textarea>
<button id="fill">填入原生草稿</button><button id="send">确认发送</button>
<button id="persona">打开原生人设</button><button id="more">打开原生更多</button><button id="snapshot">读取快照</button>
<pre id="result"></pre><p>这是旧版同层开发起点。实际原生兼容需在目标卡验收；没有实现的动作不会显示假按钮。</p>
</main><script>
(function(){
  var port=null,session='',seq=0,pending=Object.create(null),disposed=false;
  var hint=document.getElementById('state'),result=document.getElementById('result');
  function finish(id,value){var p=pending[id];if(p){clearTimeout(p.timer);delete pending[id];p.resolve(value);}}
  function call(method,params){return new Promise(function(resolve){
    if(!port||disposed){resolve({ok:false,reason:'not-connected'});return;}
    var id='r'+(++seq);pending[id]={resolve:resolve,timer:setTimeout(function(){finish(id,{ok:false,reason:'结果未确认，请查看原生记录；不要自动重试'});},16000)};
    port.postMessage({protocol:'rex-sl/2',session:session,type:'invoke',id:id,method:method,params:params||{}});
  });}
  window.addEventListener('message',function(e){
    if(e.source!==parent || port || !e.data || e.data.protocol!=='rex-sl/2' || e.data.type!=='connect' || !e.ports[0])return;
    session=e.data.session;if(typeof session!=='string')return;
    port=e.ports[0];port.onmessage=function(ev){var d=ev.data;if(d&&d.protocol==='rex-sl/2'&&d.session===session&&d.type==='result')finish(d.id,d);};port.start();
    port.postMessage({protocol:'rex-sl/2',session:session,type:'ready'});hint.textContent='宿主已连接';
  });
  function action(id,method,params){document.getElementById(id).addEventListener('click',function(){var b=this;b.disabled=true;call(method,typeof params==='function'?params():params).then(function(r){result.textContent=JSON.stringify(r,null,2);b.disabled=false;});});}
  var draft=document.getElementById('draft');
  action('back','returnNative');action('fill','setInput',function(){return {text:draft.value};});
  action('send','send',function(){return {text:draft.value};});action('persona','openPersona');action('more','openMore');action('snapshot','snapshot');
  window.addEventListener('pagehide',function(){disposed=true;Object.keys(pending).forEach(function(id){finish(id,{ok:false,reason:'disposed'});});if(port)port.close();});
  window.__REX_HUD_FRAME__={call:call};
})();
</script></body></html>
